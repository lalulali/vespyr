# Vespyr Agent System Configuration
# This file is part of the agent system, not project output.
# It exists from install and covers the full lifecycle (discovery → retro).
# Edit manually — never generated or overwritten by orchestrator_state.js.

# Step Tracker — controls step-level audit breadcrumbs
# off     — write commands exit silently (default); the Step-0 scope gate still errors+exits 1 on bypass, and scope-lock still records gate state
# silent  — writes breadcrumbs to artifacts/output/step-audit.json; no agent output
# verbose — writes breadcrumbs + prints one-liner to agent stdout per step transition
step_tracking: off

# Graph — controls what directories and patterns the code-graph and doc-graph scan.
# CLI flags (--src, --docs, --ids) override these values.
graph:
  code:
    src: src/                      # comma-separated source directories
  doc:
    docs:                          # directories (or single files) scanned for .md
      - artifacts/input/
      - artifacts/memory/
      - artifacts/output/
    ids:                           # regex patterns for document ID extraction
      - US-\d+
      - REQ-\d+
