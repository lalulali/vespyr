# Vespyr Agent System Configuration
# This file defines global runtime options for the Vespyr Multi-Agent Engine.
# Edit manually — never generated or overwritten by system scripts.

# 1. Step Tracking
# Controls the audit logging level for agent workflow steps.
#   off     : (Default) Lightweight mode. The Step-0 scope gate still enforces security, but detailed step transition logs are not written.
#   silent  : Writes step transition logs silently to `artifacts/output/step-audit.json`.
#   verbose : Writes step transition logs to `artifacts/output/step-audit.json` and prints real-time updates to stdout.
step_tracking: silent

# 2. Language Settings
# Language for GENERATED ARTIFACTS — PRDs, ADRs, specs, code docstrings, git commits.
# Conversation always mirrors the language you write in (there is no chat setting).
#   artifacts : en   (Enforces one consistent language for all generated documents & code.)
language:
  artifacts: en

